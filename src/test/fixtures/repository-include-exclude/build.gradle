plugins {
  id("java-library")
  alias(libs.plugins.licensee)
}

dependencies {
  implementation 'com.example:example:1.0.0'
}

licensee {
  allow('Apache-2.0')
}

repositories {
  maven {
    url new File(rootDir, "repo-bad")
    content {
      includeGroup('com.other')
    }
  }
  maven {
    url new File(rootDir, "repo-good")
  }
}
