name: update license json

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-start-scripts:
    runs-on: ubuntu-24.04-arm
#    if: github.event.repository.fork == false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version-file: .github/workflows/.java-version
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew downloadLicensesJson generateSpdx updateLegacyAbi
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: |
            Update license JSON

            _Auto-generated by `update license json` Github workflow._
          title: Update license JSON
          body: _Auto-generated by `update license json` Github workflow._
          branch: actions/update-start-scripts
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com> # Same as `committer`.
          delete-branch: true
